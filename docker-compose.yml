version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/office_db
      - DJANGO_SETTINGS_MODULE=your_project.settings
      - PYTHONPATH=/app
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app
      - ./your_django_project:/app/your_django_project  # Путь к вашему Django проекту
    command: uvicorn office.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - office-network
    restart: unless-stopped

  db:
    image: postgres:13
    environment:
      - POSTGRES_DB=office_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - office-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  office-network:
    driver: bridge