services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    working_dir: /app/src
    environment:
      - DJANGO_SETTINGS_MODULE=office.settings
    command: >
      sh -c "sleep 5 && 
             python manage.py migrate && 
             python manage.py runserver 0.0.0.0:8000"
    depends_on:
      - db
    
  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=office_db
      - POSTGRES_USER=office_user
      - POSTGRES_PASSWORD=office_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: